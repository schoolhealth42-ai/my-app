name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unzip project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -q "$(ls *.zip | head -n1)" -d project
          fi
      - name: Build APK
        run: |
          F=$(find . -name "settings.gradle*" -not -path "./.git/*" | head -n1)
          cd "$(dirname "$F")"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug
          else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: "**/build/outputs/apk/**/*.apk"
